<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MealLog">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark">
<title>MealLog</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow" id="title">Журнал</div>
      <h1 id="date-title">сегодня</h1>
    </div>
    <button class="month-btn" id="month-btn" hidden><span id="month-label">октябрь</span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="week-wrap" id="week-wrap" hidden>
    <button class="wk-arrow" id="wk-prev" aria-label="Неделя назад">‹</button>
    <div class="weeks" id="weeks"></div>
    <button class="wk-arrow" id="wk-next" aria-label="Неделя вперёд">›</button>
  </div>
</header>

<main>
  <!-- Журнал -->
  <section id="tab-journal" class="tab active">
    <div class="card hero" id="hero"></div>
    <p class="pace" id="pace"></p>
    <div id="fits"></div>
    <p class="empty" id="meals-empty" hidden>Записей пока нет. Отправь фото еды Claude или нажми «+» у любого приёма.</p>
    <div id="meals"></div>
  </section>

  <!-- План -->
  <section id="tab-recs" class="tab">
    <div class="rec-actions">
      <button id="regen" class="btn">Собрать план</button>
    </div>
    <p class="muted" id="rec-comment"></p>
    <div id="recs"></div>
    <p class="empty" id="recs-empty" hidden>Плана на этот день нет.</p>
  </section>

  <!-- Продукты -->
  <section id="tab-products" class="tab">
    <div class="seg prod-seg" id="prod-seg"><button data-v="fridge" class="on">В холодильнике <small></small></button><button data-v="eaten">Съедено <small></small></button></div>
    <input type="search" id="product-search" placeholder="Поиск по справочнику" autocomplete="off">
    <div id="quick"></div>
    <div id="products"></div>
    <button class="fab" id="add-product" aria-label="Добавить продукт">+</button>
  </section>

  <!-- Аналитика -->
  <section id="tab-analytics" class="tab">
    <div class="filters">
      <div class="seg" id="period">
        <button data-period="7">Неделя</button>
        <button data-period="30" class="on">Месяц</button>
        <button data-period="90">3 месяца</button>
        <button data-period="all">Всё</button>
      </div>
    </div>
    <div id="analytics"></div>
  </section>

  <!-- Цели -->
  <section id="tab-goals" class="tab">
    <form id="goals-form" class="form card">
      <h3>Нормы на день</h3>
      <label><i class="dot kcal"></i>Калории <input type="number" name="kcal" inputmode="decimal"></label>
      <label><i class="dot protein"></i>Белки, г <input type="number" name="protein" inputmode="decimal"></label>
      <label><i class="dot fat"></i>Жиры, г <input type="number" name="fat" inputmode="decimal"></label>
      <label><i class="dot carbs"></i>Углеводы, г <input type="number" name="carbs" inputmode="decimal"></label>
      <button type="submit" class="btn">Сохранить</button>
    </form>
    <form id="weight-form" class="form card">
      <h3>Вес</h3>
      <label>Сегодня, кг <input type="number" name="kg" step="0.1" inputmode="decimal"></label>
      <button type="submit" class="btn">Записать</button>
      <p class="muted" id="weight-last"></p>
    </form>
    <form id="measure-form" class="form card">
      <h3>Объёмы <small>раз в 2 недели</small></h3>
      <div class="row2">
        <label>ОГ, см <input type="number" name="chest" step="0.1" inputmode="decimal" placeholder="грудь"></label>
        <label>ОТ, см <input type="number" name="waist" step="0.1" inputmode="decimal" placeholder="талия"></label>
        <label>ОБ, см <input type="number" name="hips" step="0.1" inputmode="decimal" placeholder="бёдра"></label>
      </div>
      <label>Дата замера <input type="date" name="date"></label>
      <button type="submit" class="btn">Записать</button>
      <div id="measure-info"></div>
    </form>
    <div class="card push-card" id="push-card"></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="journal" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg><span>Журнал</span></button>
  <button data-tab="recs">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span>План</span></button>
  <button data-tab="products">
    <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 11h12M9 7v2M9 14v3"/></svg><span>Продукты</span></button>
  <button data-tab="analytics">
    <svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg><span>Аналитика</span></button>
  <button data-tab="goals">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg><span>Цели</span></button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div class="grip"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
