<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MealLog">
<meta name="theme-color" content="#228b5e">
<title>MealLog</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Журнал</h1>
  <div class="date-nav" id="date-nav">
    <button class="icon-btn" data-day="-1">‹</button>
    <span id="date-label">сегодня</span>
    <button class="icon-btn" data-day="1">›</button>
  </div>
</header>

<main>
  <!-- Журнал -->
  <section id="tab-journal" class="tab active">
    <div class="bars" id="bars"></div>
    <p class="pace" id="pace"></p>
    <ul class="list" id="meals"></ul>
    <p class="empty" id="meals-empty" hidden>Записей пока нет. Отправь фото еды Claude или добавь вручную.</p>
    <button class="fab" id="add-meal">+</button>
  </section>

  <!-- Рекомендации -->
  <section id="tab-recs" class="tab">
    <div class="rec-actions">
      <button id="regen" class="btn">Перегенерировать</button>
    </div>
    <p class="muted" id="rec-comment"></p>
    <div id="recs"></div>
    <p class="empty" id="recs-empty" hidden>Плана на этот день нет.</p>
  </section>

  <!-- Продукты -->
  <section id="tab-products" class="tab">
    <input type="search" id="product-search" placeholder="Поиск по справочнику" autocomplete="off">
    <div id="quick"></div>
    <div id="products"></div>
    <button class="fab" id="add-product">+</button>
  </section>

  <!-- Аналитика -->
  <section id="tab-analytics" class="tab">
    <div class="seg" id="period">
      <button data-days="7">7 дн</button>
      <button data-days="30" class="on">30 дн</button>
      <button data-days="90">90 дн</button>
    </div>
    <div class="stats" id="stats"></div>
    <h3>Калории по дням</h3><canvas id="ch-kcal" height="160"></canvas>
    <h3>Б / Ж / У по дням</h3><canvas id="ch-macros" height="160"></canvas>
    <h3>Вес</h3><canvas id="ch-weight" height="140"></canvas>
    <h3>Калории по времени суток</h3><canvas id="ch-hours" height="120"></canvas>
    <h3>Чаще всего</h3><ol class="top" id="top"></ol>
  </section>

  <!-- Цели -->
  <section id="tab-goals" class="tab">
    <form id="goals-form" class="form">
      <h3>Нормы на день</h3>
      <label>Калории <input type="number" name="kcal" inputmode="decimal"></label>
      <label>Белки, г <input type="number" name="protein" inputmode="decimal"></label>
      <label>Жиры, г <input type="number" name="fat" inputmode="decimal"></label>
      <label>Углеводы, г <input type="number" name="carbs" inputmode="decimal"></label>
      <button type="submit" class="btn">Сохранить</button>
    </form>
    <form id="weight-form" class="form">
      <h3>Вес</h3>
      <label>Сегодня, кг <input type="number" name="kg" step="0.1" inputmode="decimal"></label>
      <button type="submit" class="btn">Записать</button>
      <p class="muted" id="weight-last"></p>
    </form>
  </section>
</main>

<nav class="tabs">
  <button data-tab="journal" class="on">Журнал</button>
  <button data-tab="recs">План</button>
  <button data-tab="products">Продукты</button>
  <button data-tab="analytics">Аналитика</button>
  <button data-tab="goals">Цели</button>
</nav>

<!-- modals -->
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div id="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
